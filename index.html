<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บัญชีร้านหม่าล่าทอด</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0EA;--card:#fff;--ink:#1D2420;--mute:#5F6B63;--line:#D5DBD2;--soft:#F3F5F0;--red:#C9261C;--green:#2F6B4F;--gold:#E0A526;--neg:#B3261E;--pos:#1F6B45;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151A17;--card:#1F2622;--ink:#EBEFE9;--mute:#9AA69D;--line:#33403A;--soft:#27302B;--red:#D93A2F;--green:#5FB88C;--neg:#FF7A70;--pos:#6FD39D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151A17;--card:#1F2622;--ink:#EBEFE9;--mute:#9AA69D;--line:#33403A;--soft:#27302B;--red:#D93A2F;--green:#5FB88C;--neg:#FF7A70;--pos:#6FD39D;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header{background:var(--red);color:#fff;padding:18px 0 16px}
header h1{font-family:'Mitr',sans-serif;font-weight:500;font-size:22px;margin:0}
header p{margin:2px 0 0;opacity:.85;font-size:14px}
h2{font-family:'Mitr',sans-serif;font-weight:500;font-size:17px;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.mute,small{color:var(--mute)}
small{display:block;font-size:13px}
.f{display:block;font-size:14px;color:var(--mute);margin:10px 0 0}
.f:first-child{margin-top:0}
input{font:inherit;width:100%;padding:9px 10px;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.nm{font-weight:500}
.step{display:flex;gap:6px;align-items:center}
.step input{width:64px;margin:0;text-align:center;font-weight:700;font-size:18px}
.step button{width:42px;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;cursor:pointer}
.step button:last-child{background:var(--green);border-color:var(--green);color:#fff}
.hero{padding:14px;border-radius:10px;background:var(--soft);margin-bottom:8px}
.hero span{font-size:14px;color:var(--mute)}
.hero b{display:block;font-family:'Mitr',sans-serif;font-weight:600;font-size:40px;line-height:1.2}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.kv{display:flex;justify-content:space-between;padding:5px 0}
.kv b{font-weight:700}
.note{margin-top:8px;padding:9px 11px;border-left:4px solid var(--gold);background:var(--soft);border-radius:4px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .card b{display:block;font-family:'Mitr',sans-serif;font-weight:500;font-size:20px}
.mrow{padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.m3{display:grid;grid-template-columns:2fr 1fr 1fr 40px;gap:6px;align-items:end}
.m3 label{font-size:12px;color:var(--mute)}
.del{height:40px;border:1px solid var(--line);background:var(--card);color:var(--neg);border-radius:8px;font-size:18px;cursor:pointer}
.btn{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--green);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:430px;font-size:14px}
th,td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500}
.bar{height:8px;border-radius:4px;background:var(--green);margin-top:4px}
.bar.n{background:var(--neg)}
.drow{padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.drow:last-child{border-bottom:0}
nav{position:fixed;left:0;right:0;bottom:0;top:auto;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:12px 2px;border:0;background:none;color:var(--mute);font:inherit;font-size:14px;cursor:pointer;border-top:3px solid transparent}
nav button[aria-current="true"]{color:var(--red);font-weight:700;border-top-color:var(--red)}
</style>
</head>
<body>
<header><div class="wrap"><h1 id="shop">ร้านหม่าล่าทอด</h1><p id="sub"></p></div></header>
<main class="wrap" id="app"></main>
<nav id="nav">
<button data-tab="day">วันนี้</button><button data-tab="menu">เมนู</button><button data-tab="fix">ค่าคงที่</button><button data-tab="sum">สรุป</button>
</nav>
<script>
const KEY='malaShop.v1';
const dflt={shop:'ร้านหม่าล่าทอด',nid:5,
menu:[{id:1,name:'หมูสไลซ์',price:10,cost:4},{id:2,name:'ลูกชิ้นปลา',price:8,cost:3},{id:3,name:'เห็ดเข็มทอง',price:8,cost:3},{id:4,name:'เต้าหู้ทอด',price:8,cost:2.5}],
set:{rent:3000,labor:0,util:1500,other:500,days:26,target:60},days:{}};
const $=s=>document.querySelector(s);
const num=v=>+v||0;
const fmt=n=>Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2});
const baht=n=>(n<0?'−':'')+'฿'+fmt(Math.abs(n));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function load(){try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);return Object.assign(JSON.parse(JSON.stringify(dflt)),p)}}catch(e){}return JSON.parse(JSON.stringify(dflt))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),tab='day',date=today(),month=today().slice(0,7);
const fixedMonth=()=>num(S.set.rent)+num(S.set.labor)+num(S.set.util)+num(S.set.other);
const fixedDay=()=>fixedMonth()/Math.max(1,num(S.set.days));
const avgCps=()=>{const l=S.menu;return l.length?l.reduce((a,m)=>a+m.price-m.cost,0)/l.length:0};
function calc(rec){rec=rec||{qty:{}};let sticks=0,rev=0,cogs=0;
 S.menu.forEach(m=>{const q=num(rec.qty&&rec.qty[m.id]);sticks+=q;rev+=q*m.price;cogs+=q*m.cost});
 const waste=num(rec.waste),extra=num(rec.extra),fixed=fixedDay(),gross=rev-cogs-waste-extra;
 return{sticks,rev,cogs,waste,extra,gross,fixed,net:gross-fixed}}
function rec(){return S.days[date]||(S.days[date]={qty:{}})}
function thDate(k,long){return new Date(k+'T00:00:00').toLocaleDateString('th-TH',long?{weekday:'long',day:'numeric',month:'long'}:{day:'numeric',month:'short'})}

function viewDay(){const r=S.days[date]||{qty:{}};
 return `<label class="f">วันที่<input type="date" id="dt" value="${date}"></label>
 <h2>ผลของวันนี้</h2><div class="card" id="res"></div>
 <h2>ขายได้ (ไม้)</h2><div class="card">${S.menu.map(m=>`<div class="row"><div class="nm">${esc(m.name)}<small>ขาย ${fmt(m.price)} · ทุน ${fmt(m.cost)}</small></div><div class="step"><button aria-label="ลด" data-d="-1" data-id="${m.id}">−</button><input type="number" inputmode="numeric" min="0" data-q="${m.id}" value="${r.qty[m.id]||''}" placeholder="0"><button aria-label="เพิ่ม" data-d="1" data-id="${m.id}">+</button></div></div>`).join('')||'<p class="mute">ยังไม่มีเมนู ไปที่แท็บเมนูเพื่อเพิ่ม</p>'}</div>
 <h2>รายจ่ายอื่นของวันนี้</h2><div class="card">
 <label class="f">ของเสีย/เหลือทิ้ง (บาท)<input type="number" inputmode="decimal" id="waste" value="${r.waste||''}" placeholder="0"></label>
 <label class="f">ค่าใช้จ่ายอื่น เช่น น้ำแข็ง ถุง (บาท)<input type="number" inputmode="decimal" id="extra" value="${r.extra||''}" placeholder="0"></label></div>`}
function updDay(){const r=S.days[date]||{qty:{}},c=calc(r);
 const cps=c.sticks?(c.rev-c.cogs)/c.sticks:avgCps();
 const need=cps>0?Math.ceil((c.fixed+c.waste+c.extra)/cps):0;
 let note='';
 if(!c.sticks)note='ยังไม่ได้กรอกยอดขาย กดปุ่ม + ที่เมนูด้านล่าง';
 else if(c.net>=0)note=`คุ้มทุนแล้ว เกินมา ${fmt(c.sticks-need)} ไม้`;
 else note=`ยังขาดอีกประมาณ ${fmt(need-c.sticks)} ไม้ถึงจะคุ้มทุนวันนี้`;
 $('#res').innerHTML=`<div class="hero"><span>กำไรสุทธิวันนี้ (หลังหักค่าคงที่)</span><b class="${c.net>=0?'pos':'neg'}">${baht(c.net)}</b></div>
 <div class="kv"><span>ขายได้</span><b>${fmt(c.sticks)} ไม้</b></div>
 <div class="kv"><span>ยอดขาย</span><b>${baht(c.rev)}</b></div>
 <div class="kv"><span>ต้นทุนวัตถุดิบ</span><b>−${baht(c.cogs)}</b></div>
 <div class="kv"><span>ของเสีย + รายจ่ายอื่น</span><b>−${baht(c.waste+c.extra)}</b></div>
 <div class="kv"><span>กำไรก่อนหักค่าคงที่</span><b>${baht(c.gross)}</b></div>
 <div class="kv"><span>ค่าคงที่ส่วนของวันนี้</span><b>−${baht(c.fixed)}</b></div>
 <div class="note">${note}</div>`}

function viewMenu(){return `<h2>เมนูและต้นทุนต่อไม้</h2><p class="mute" style="margin:0 0 8px">ราคาในตารางเป็นตัวอย่าง แก้เป็นของร้านได้เลย</p><div class="card">`+
 S.menu.map(m=>`<div class="mrow"><div class="m3"><div><label>ชื่อ</label><input data-m="name" data-id="${m.id}" value="${esc(m.name)}" style="margin-top:2px"></div><div><label>ขาย</label><input type="number" inputmode="decimal" data-m="price" data-id="${m.id}" value="${m.price}" style="margin-top:2px"></div><div><label>ทุน</label><input type="number" inputmode="decimal" data-m="cost" data-id="${m.id}" value="${m.cost}" style="margin-top:2px"></div><button class="del" aria-label="ลบ" data-del="${m.id}">✕</button></div><small id="mg${m.id}"></small></div>`).join('')+
 `<button class="btn" id="addm">เพิ่มเมนู</button></div>`}
function updMg(){S.menu.forEach(m=>{const e=$('#mg'+m.id);if(e){const p=m.price-m.cost,pc=m.price?p/m.price*100:0;e.textContent=`กำไร ${fmt(p)} บาท/ไม้ (${fmt(pc)}%)`}})}

function viewFix(){const s=S.set;const f=(k,l)=>`<label class="f">${l}<input type="number" inputmode="decimal" data-s="${k}" value="${s[k]}"></label>`;
 return `<h2>ค่าใช้จ่ายคงที่ต่อเดือน</h2><div class="card">${f('rent','ค่าเช่าที่/ค่าที่ขาย (บาท)')}${f('labor','ค่าแรงลูกจ้าง (บาท)')}${f('util','ค่าแก๊ส ไฟ น้ำ (บาท)')}${f('other','อื่นๆ เช่น ค่าเสื่อมอุปกรณ์ ค่า GP (บาท)')}</div>
 <h2>การวางแผน</h2><div class="card">${f('days','เปิดร้านกี่วันต่อเดือน')}${f('target','เป้ากำไรขั้นต้นต่อไม้ (%)')}</div>
 <div class="note" id="fx"></div>
 <h2>ชื่อร้าน</h2><div class="card"><input id="shopin" value="${esc(S.shop)}"></div>
 <h2>ข้อมูล</h2><div class="card"><small>ข้อมูลเก็บไว้ในเบราว์เซอร์ของเครื่องนี้เท่านั้น ถ้าล้างข้อมูลเบราว์เซอร์ ข้อมูลจะหาย</small><button class="btn" id="rst" style="background:var(--neg)">ล้างข้อมูลทั้งหมด</button></div>`}
function updFix(){const e=$('#fx');if(e)e.textContent=`รวมค่าคงที่ ${baht(fixedMonth())} ต่อเดือน เฉลี่ยวันละ ${baht(fixedDay())}`}

function viewSum(){
 const keys=Object.keys(S.days).filter(k=>k.startsWith(month)).sort();
 const rows=keys.map(k=>({k,c:calc(S.days[k])})).filter(x=>x.c.sticks>0||x.c.waste||x.c.extra);
 const n=rows.length;
 let h=`<label class="f">เดือน<input type="month" id="mo" value="${month}"></label>`;
 if(!n)return h+`<div class="card" style="margin-top:12px"><p class="mute" style="margin:0">เดือนนี้ยังไม่มีข้อมูล กรอกยอดขายที่แท็บ “วันนี้” แล้วสรุปจะขึ้นที่นี่</p></div>`;
 const T=rows.reduce((a,x)=>{for(const k of['sticks','rev','cogs','waste','extra','gross'])a[k]+=x.c[k];return a},{sticks:0,rev:0,cogs:0,waste:0,extra:0,gross:0});
 const fixed=fixedDay()*n,net=T.gross-fixed,avgS=T.sticks/n,avgG=T.gross/n;
 const cps=T.sticks?(T.rev-T.cogs)/T.sticks:avgCps();
 const be=cps>0?Math.ceil((fixedDay()+(T.waste+T.extra)/n)/cps):0;
 const proj=avgG*num(S.set.days)-fixedMonth();
 h+=`<h2>ภาพรวม ${n} วันที่บันทึก</h2><div class="hero"><span>กำไรสุทธิสะสม</span><b class="${net>=0?'pos':'neg'}">${baht(net)}</b></div>
 <div class="grid"><div class="card"><small>ยอดขาย</small><b>${baht(T.rev)}</b></div><div class="card"><small>ต้นทุนวัตถุดิบ</small><b>${baht(T.cogs)}</b></div>
 <div class="card"><small>ของเสีย + อื่นๆ</small><b>${baht(T.waste+T.extra)}</b></div><div class="card"><small>ค่าคงที่ (${n} วัน)</small><b>${baht(fixed)}</b></div>
 <div class="card"><small>ขายเฉลี่ย</small><b>${fmt(avgS)} ไม้/วัน</b></div><div class="card"><small>กำไรสุทธิเฉลี่ย</small><b>${baht(net/n)}/วัน</b></div></div>
 <div class="note">จุดคุ้มทุน ${fmt(be)} ไม้/วัน ${avgS>=be?`ตอนนี้ขายเฉลี่ยสูงกว่า ${fmt(avgS-be)} ไม้`:`ตอนนี้ขายเฉลี่ยต่ำกว่า ${fmt(be-avgS)} ไม้`}<br>ถ้าเปิด ${fmt(S.set.days)} วัน และยอดเท่านี้ คาดว่ากำไรสุทธิทั้งเดือน ${baht(proj)}</div>`;
 const wk=num(S.set.days)*7/30,tg=Math.min(95,num(S.set.target))/100;
 const per=S.menu.map(m=>{const q=rows.reduce((a,x)=>a+num(S.days[x.k].qty[m.id]),0);const sug=m.cost/(1-tg);return{m,q,sug,pc:m.price?(m.price-m.cost)/m.price*100:0,wkq:Math.ceil(q/n*wk*1.1)}});
 h+=`<h2>รายเมนู</h2><div class="card scroll"><table><tr><th>เมนู</th><th>ขายรวม</th><th>กำไร/ไม้</th><th>กำไร %</th><th>ควรขาย ≥</th></tr>`+
 per.map(p=>`<tr><td>${esc(p.m.name)}</td><td>${fmt(p.q)}</td><td>${fmt(p.m.price-p.m.cost)}</td><td>${fmt(p.pc)}%</td><td class="${p.m.price<p.sug?'neg':''}">${fmt(Math.ceil(p.sug*2)/2)}</td></tr>`).join('')+`</table></div>
 <small style="margin-top:6px">คอลัมน์ “ควรขาย ≥” คือราคาที่ได้กำไรขั้นต้น ${fmt(tg*100)}% ตัวสีแดงคือราคาปัจจุบันยังต่ำกว่าเป้า</small>
 <h2>เตรียมของต่อสัปดาห์ (บวกเผื่อ 10%)</h2><div class="card">`+per.map(p=>`<div class="kv"><span>${esc(p.m.name)}</span><b>${fmt(p.wkq)} ไม้</b></div>`).join('')+`</div>
 <h2>รายวัน (กดเพื่อแก้)</h2><div class="card">`;
 const mx=Math.max(...rows.map(x=>Math.abs(x.c.net)),1);
 h+=rows.slice().reverse().map(x=>`<div class="drow" data-go="${x.k}"><div class="kv" style="padding:0"><span>${thDate(x.k)} · ${fmt(x.c.sticks)} ไม้</span><b class="${x.c.net>=0?'pos':'neg'}">${baht(x.c.net)}</b></div><div class="bar ${x.c.net<0?'n':''}" style="width:${Math.max(2,Math.abs(x.c.net)/mx*100)}%"></div></div>`).join('')+`</div>`;
 return h}

function render(){
 $('#shop').textContent=S.shop;$('#sub').textContent=thDate(today(),true);
 document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab));
 $('#app').innerHTML=({day:viewDay,menu:viewMenu,fix:viewFix,sum:viewSum})[tab]();
 if(tab==='day')updDay();if(tab==='menu')updMg();if(tab==='fix')updFix()}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();window.scrollTo(0,0);return}
 const b=e.target.closest('button[data-d]');
 if(b){const i=document.querySelector(`[data-q="${b.dataset.id}"]`);i.value=Math.max(0,num(i.value)+num(b.dataset.d));i.dispatchEvent(new Event('input',{bubbles:true}));return}
 const g=e.target.closest('[data-go]');if(g){date=g.dataset.go;tab='day';render();window.scrollTo(0,0);return}
 const d=e.target.closest('[data-del]');
 if(d){const m=S.menu.find(x=>x.id==d.dataset.del);if(m&&confirm('ลบเมนู '+m.name+' ?')){S.menu=S.menu.filter(x=>x!==m);save();render()}return}
 if(e.target.id==='addm'){S.menu.push({id:S.nid++,name:'เมนูใหม่',price:10,cost:4});save();render();return}
 if(e.target.id==='rst'&&confirm('ล้างข้อมูลทั้งหมด? กู้คืนไม่ได้')){try{localStorage.removeItem(KEY)}catch(x){}S=load();render()}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.q){rec().qty[t.dataset.q]=num(t.value);save();updDay()}
 else if(t.id==='waste'||t.id==='extra'){rec()[t.id]=num(t.value);save();updDay()}
 else if(t.dataset.m){const m=S.menu.find(x=>x.id==t.dataset.id);if(m){m[t.dataset.m]=t.dataset.m==='name'?t.value:num(t.value);save();updMg()}}
 else if(t.dataset.s){S.set[t.dataset.s]=num(t.value);save();updFix()}
 else if(t.id==='shopin'){S.shop=t.value||'ร้านหม่าล่าทอด';save();$('#shop').textContent=S.shop}
});
document.addEventListener('change',e=>{
 if(e.target.id==='dt'&&e.target.value){date=e.target.value;render()}
 if(e.target.id==='mo'&&e.target.value){month=e.target.value;render()}
});
render();
</script>
<script>
(async()=>{
 if(!window.claude||!window.claude.use)return;
 let db=null,user=null;
 try{db=await window.claude.use('db');user=await window.claude.use('user')}catch(e){}
 if(!db)return;
 let canW=true,isOwner=false;
 try{const c=user?await user.can('data.write'):null;if(c===false)canW=false;isOwner=user?await user.isOwner():false}catch(e){}
 const dirty={},last={},timers={},busy={};
 const CFG='shop/config';
 const cfgOf=()=>({shop:S.shop,menu:S.menu,nid:S.nid,set:S.set});
 const clone=o=>JSON.parse(JSON.stringify(o));
 const cur=p=>p===CFG?cfgOf():S.days[p.slice(5)];
 function stat(t){let e=document.getElementById('st');if(!e){e=document.createElement('p');e.id='st';e.style.cssText='margin:2px 0 0;font-size:13px;opacity:.85';document.querySelector('header .wrap').appendChild(e)}e.textContent=t}
 const base=()=>stat(canW?'ข้อมูลซิงก์สดกับทุกคนที่เปิดลิงก์นี้':'โหมดดูอย่างเดียว ไม่มีสิทธิ์แก้ไข');
 function queue(p){dirty[p]=true;clearTimeout(timers[p]);timers[p]=setTimeout(()=>flush(p),600)}
 async function flush(p){
  if(busy[p]){timers[p]=setTimeout(()=>flush(p),300);return}
  busy[p]=true;const s=JSON.stringify(cur(p));
  try{await db.doc(p).set(clone(cur(p)));last[p]=s;base()}
  catch(e){if(e&&e.code==='invalid_argument'){canW=false;base();window.render()}else stat('บันทึกไม่สำเร็จ จะลองใหม่เมื่อแก้ครั้งถัดไป');busy[p]=false;dirty[p]=false;return}
  busy[p]=false;
  if(JSON.stringify(cur(p))!==s)queue(p);else dirty[p]=false}
 const save0=window.save;
 window.save=function(){save0();if(!canW)return;
  if(JSON.stringify(cfgOf())!==last[CFG])queue(CFG);
  for(const k in S.days){const p='days/'+k;if(JSON.stringify(S.days[k])!==last[p])queue(p)}};
 function refresh(){
  const a=document.activeElement,typing=a&&a.matches&&a.matches('#app input');
  if(!typing){window.render();return}
  if(tab==='day'){const r=S.days[date]||{qty:{}};
   document.querySelectorAll('[data-q]').forEach(i=>{if(i!==a)i.value=r.qty[i.dataset.q]||''});
   ['waste','extra'].forEach(id=>{const i=document.getElementById(id);if(i&&i!==a)i.value=r[id]||''});updDay()}
  else if(tab==='menu')updMg();else if(tab==='fix')updFix()}
 const r0=window.render;
 window.render=function(){r0();
  if(!canW)document.querySelectorAll('#app input:not(#dt):not(#mo),#app button').forEach(e=>{e.disabled=true});
  const b=document.getElementById('rst');
  if(b){const c=b.closest('.card');const sm=c.querySelector('small');if(sm)sm.textContent='ข้อมูลซิงก์กับทุกคนที่เปิดลิงก์นี้ จึงปิดปุ่มล้างข้อมูลไว้';b.remove()}};
 let seeded=false;
 db.doc(CFG).onSnapshot(snap=>{
  if(snap.exists){
   if(dirty[CFG])return;
   const d=clone(snap.data());
   S.shop=d.shop||S.shop;S.menu=d.menu||[];S.nid=d.nid||S.nid;S.set=Object.assign(S.set,d.set||{});
   last[CFG]=JSON.stringify(cfgOf());save0();refresh();base()
  }else if(!seeded&&canW&&isOwner){
   seeded=true;queue(CFG);for(const k in S.days)queue('days/'+k)}
 },()=>stat('ซิงก์ข้อมูลไม่ได้ตอนนี้'));
 db.collection('days').onSnapshot(snap=>{
  let ch=false;
  snap.docs.forEach(d=>{const p='days/'+d.id;if(dirty[p])return;
   const v=clone(d.data());v.qty=v.qty||{};S.days[d.id]=v;last[p]=JSON.stringify(v);ch=true});
  if(ch){save0();refresh()}
 },()=>stat('ซิงก์ข้อมูลไม่ได้ตอนนี้'));
 base();window.render();
})();
</script>
</body>
</html>
